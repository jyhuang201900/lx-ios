name: iOS Screenshots

# 在 macOS runner 上启动 iOS 模拟器、安装 Release 包、启动并截图。
# 产物 ios-screenshots 里每台机型一组：首页、稳定态、播放详情。
# 目的：没有本地 Mac 时，也能拿到真实渲染画面核对版式。
on:
  workflow_dispatch:
    inputs:
      devices:
        description: '机型，逗号分隔；留空则用 iPhone 16 Pro + iPhone SE'
        required: false
        default: ''
  # 备用扳机：本机到 api.github.com 的链路经常整段不通（workflow_dispatch
  # 打不出去），而 git push 到 github.com 还能用。往这条分支推任意提交
  # 就会跑一轮截图，用的仍是默认双机型。
  push:
    branches:
      - shoot

permissions:
  # 要把截图推到 shots 分支，必须能写
  contents: write

concurrency:
  group: ios-screenshots
  cancel-in-progress: true

jobs:
  screenshot:
    name: Screenshot on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NO_FLIPPER: 1
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_SCHEME: LxMusicMobile
      IOS_BUNDLE_IDENTIFIER: cn.toside.music.mobile
      DERIVED_DATA_PATH: build/DerivedData

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      # pod install 的 spec 仓库走网络，每次 --repo-update 都要重新拉一遍
      # （5~10 分钟）。Podfile.lock 没变时直接复用上一轮的 Pods 目录。
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -o pipefail
          cd ios
          # run 18 挂在这一步：96 秒后 exit 1，随后的 Build 直接 skipped，
          # 一张图都没拍。pod install 会走网络（spec 元数据、CDN），是整条
          # 流水线里最容易偶发失败的一环，所以给它三次机会，并在失败时把
          # 日志尾巴打出来——否则只看到一个 exit code 1，查不出原因。
          for attempt in 1 2 3; do
            if bundle exec pod install 2>&1 | tee /tmp/pod-install.log; then
              exit 0
            fi
            echo "::warning::pod install failed on attempt $attempt"
            tail -n 60 /tmp/pod-install.log
            sleep 20
          done
          echo "::error::pod install failed after 3 attempts"
          exit 1

      # DerivedData：原生代码在 iOS 适配分支上很少动，缓存命中的 run 只需
      # 重打 JS bundle 并重新链接。key 里带上 Podfile.lock 与 ios 源文件的
      # 哈希，命中不到就退回全量编译。
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}
          key: derived-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}-${{ hashFiles('ios/**/*.m','ios/**/*.mm','ios/**/*.swift','ios/**/*.h') }}
          restore-keys: |
            derived-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}-

      # Release 会把 JS 打进 app，模拟器里不需要再起 Metro。
      - name: Build for simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/xcodebuild-sim.log

      # 模拟器命令偶尔会卡住（bootstatus / spawn / log show），全部套超时，
      # 卡住只降级、不拖垮整条流水线。
      - name: Boot simulators and capture
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p shots

          stamp() { date -u '+%H:%M:%S'; }
          with_timeout() {
            local secs="$1"; shift
            echo "[$(stamp)] == $* (max ${secs}s)"
            perl -e 'alarm shift; exec @ARGV' "$secs" "$@" || echo "::warning::timed out or failed: $*"
          }

          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::没有找到 .app"
            find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 3 -name '*.app'
            exit 1
          fi
          echo "app: $APP_PATH"

          DEVICES="${{ inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            # 大屏 + 小屏：同一套版式在两种宽度下才看得出有没有挤压和截断
            DEVICES="iPhone 16 Pro,iPhone SE (3rd generation)"
          fi

          with_timeout 120 xcrun simctl list devices available

          udid_of() {
            xcrun simctl list devices available -j \
              | jq -r --arg n "$1" '[.devices[][] | select(.isAvailable and .name == $n)][0].udid // empty'
          }
          name_of() {
            xcrun simctl list devices available -j \
              | jq -r --arg u "$1" '[.devices[][] | select(.udid == $u)][0].name // empty'
          }
          first_iphone() {
            xcrun simctl list devices available -j \
              | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty'
          }

          # 首启有两个闸门：谨防被骗提示、许可协议。两者都在 AsyncStorage 的
          # manifest.json 里有开关，直接写进去，截图才拍得到真正的界面。
          manifest_path() {
            local udid="$1" container manifest
            container="$(xcrun simctl get_app_container "$udid" "$IOS_BUNDLE_IDENTIFIER" data 2>/dev/null)" || return 0
            [ -n "$container" ] || return 0
            manifest="$container/Library/Application Support/$IOS_BUNDLE_IDENTIFIER/RCTAsyncLocalStorage_V1/manifest.json"
            if [ ! -f "$manifest" ]; then
              manifest="$(find "$container" -name manifest.json -path '*RCTAsyncLocalStorage*' -print -quit)"
            fi
            [ -n "$manifest" ] && [ -f "$manifest" ] && echo "$manifest"
          }
          write_manifest() {
            local udid="$1" setting="$2" manifest
            manifest="$(manifest_path "$udid")"
            if [ -z "$manifest" ]; then
              echo "::warning::没找到 AsyncStorage manifest，首启提示可能弹窗"
              return 0
            fi
            echo "seed settings -> $manifest"
            jq --arg v "$setting" '. + {"@cheat_tip":"true","@setting_v1":$v}' "$manifest" > "$manifest.tmp" \
              && mv "$manifest.tmp" "$manifest"
          }

          # 模拟器上点不了，界面落点只能靠预置存储：基础设置 + 每页增量。
          # 每页都冷启动一次，拍完一张就停掉，避免上一页的状态串到下一页。
          BASE_SETTING='{"version":"2.0","common.isAgreePact":true,"common.langId":"zh_cn"}'
          seed_settings() {
            local udid="$1" extra="$2" merged
            merged="$(jq -c -n --argjson b "$BASE_SETTING" --argjson e "$extra" '$b + $e')"
            write_manifest "$udid" "$merged"
          }
          # 演示歌：给"有歌态"的页面用。
          #
          # MusicInfo 的 meta.picUrl 故意留 null —— 封面走 EmptyPic 的 ♪ 占位，
          # 正好也验一遍有歌时占位是什么观感。startupAutoPlay 显式关掉，所以
          # 不会真去请求播放地址，只是把播放列表与当前曲目塞进状态。
          DEMO_LIST='[{"id":"kw_demo0001","name":"午夜霓虹","singer":"演示歌手","source":"kw","interval":"03:42","meta":{"songId":"demo0001","albumName":"演示专辑","picUrl":null,"qualitys":[],"_qualitys":{},"albumId":"demoalbum"}}]'
          DEMO_PLAY='{"time":0,"maxTime":222,"listId":"demo","index":0}'
          seed_demo() {
            local udid="$1" manifest
            manifest="$(manifest_path "$udid")"
            if [ -z "$manifest" ]; then
              echo "::warning::没找到 manifest，演示歌没写进去"
              return 0
            fi
            jq --arg l "$DEMO_LIST" --arg p "$DEMO_PLAY" \
              '. + {"@list__demo":$l,"@play_info":$p}' "$manifest" > "$manifest.tmp" \
              && mv "$manifest.tmp" "$manifest"
            echo "seed demo track"
          }
          shoot() {
            local udid="$1" out="$2" extra="$3" settle="$4" demo="${5:-}"
            with_timeout 60 xcrun simctl terminate "$udid" "$IOS_BUNDLE_IDENTIFIER" >/dev/null 2>&1 || true
            seed_settings "$udid" "$extra"
            [ -n "$demo" ] && seed_demo "$udid"
            with_timeout 60 xcrun simctl launch "$udid" "$IOS_BUNDLE_IDENTIFIER"
            sleep "$settle"
            with_timeout 60 xcrun simctl io "$udid" screenshot "$out"
            echo "[$(stamp)] shot $(basename "$out")"
          }

          TARGETS=""
          IFS=',' read -ra WANTED <<< "$DEVICES"
          for RAW in "${WANTED[@]}"; do
            NAME="$(echo "$RAW" | sed 's/^ *//; s/ *$//')"
            [ -z "$NAME" ] && continue
            UDID="$(udid_of "$NAME")"
            if [ -z "$UDID" ]; then
              echo "::warning::模拟器不可用，跳过：$NAME"
              continue
            fi
            TARGETS="$TARGETS $UDID"
          done

          if [ -z "$TARGETS" ]; then
            FALLBACK="$(first_iphone)"
            if [ -z "$FALLBACK" ]; then
              echo "::error::这台 runner 上没有可用的 iPhone 模拟器"
              exit 1
            fi
            echo "::warning::请求的机型都不存在，改用 $(name_of "$FALLBACK")"
            TARGETS=" $FALLBACK"
          fi

          for UDID in $TARGETS; do
            NAME="$(name_of "$UDID")"
            [ -z "$NAME" ] && NAME="device-${UDID%%-*}"
            SLUG="$(echo "$NAME" | tr ' ()/' '----' | tr -s '-' | tr 'A-Z' 'a-z')"
            echo "[$(stamp)] == $NAME ($UDID) -> shots/$SLUG"

            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            with_timeout 180 xcrun simctl boot "$UDID"
            with_timeout 240 xcrun simctl bootstatus "$UDID" -b || true
            with_timeout 60 xcrun simctl ui "$UDID" appearance dark
            with_timeout 60 xcrun simctl status_bar "$UDID" override \
              --time "9:41" --batteryState charged --batteryLevel 100 \
              --wifiBars 3 --cellularBars 4
            with_timeout 120 xcrun simctl install "$UDID" "$APP_PATH"

            # 先启动一次建出存储目录，写首启标记，再重启拍照。
            #
            # 不能只 sleep 8 秒就 terminate：run 25 就栽在这里。app 首次启动
            # 还在初始化，AsyncStorage 的 manifest 还没落盘，write_manifest
            # 找不到文件、静默跳过，于是 01/02 两张拍成了默认的英文界面加
            # 「谨防被骗」弹窗——同一轮里 03 之后都正常，因为那时 manifest
            # 已经被上一次启动写出来了。改成轮询等文件出现（最多 30 秒）。
            with_timeout 60 xcrun simctl launch "$UDID" "$IOS_BUNDLE_IDENTIFIER"
            for i in $(seq 1 30); do
              if [ -n "$(manifest_path "$UDID")" ]; then
                echo "[$(stamp)] manifest ready after ${i}s"
                break
              fi
              sleep 1
            done
            with_timeout 60 xcrun simctl terminate "$UDID" "$IOS_BUNDLE_IDENTIFIER"

            # 首页/搜索空态，隔 5 秒再拍一张稳定态
            shoot "$UDID" "shots/${SLUG}-01-home.png" '{"player.startupPushPlayDetailScreen":false}' 12
            sleep 5
            with_timeout 60 xcrun simctl io "$UDID" screenshot "shots/${SLUG}-02-home-settled.png"

            # 播放详情：Home 挂载后直接推，不需要点按
            shoot "$UDID" "shots/${SLUG}-03-play-detail.png" '{"player.startupPushPlayDetailScreen":true}' 14

            # 五个标签页：靠 common.startupNavId 冷启动落位
            shoot "$UDID" "shots/${SLUG}-04-songlist.png" '{"common.startupNavId":"nav_songlist"}' 10
            shoot "$UDID" "shots/${SLUG}-05-chart.png" '{"common.startupNavId":"nav_top"}' 12
            shoot "$UDID" "shots/${SLUG}-06-love.png" '{"common.startupNavId":"nav_love"}' 10
            shoot "$UDID" "shots/${SLUG}-07-local.png" '{"common.startupNavId":"nav_local"}' 10
            shoot "$UDID" "shots/${SLUG}-08-setting.png" '{"common.startupNavId":"nav_setting"}' 10

            # 搜索页：默认设置下会去拉热词，等它落定再拍
            shoot "$UDID" "shots/${SLUG}-09-search.png" '{"common.startupNavId":"nav_search","search.isShowHotSearch":true}' 16

            # 深色主题：模拟器的 appearance 已经设成 dark，但应用默认不跟随系统
            # （common.isAutoTheme=false），所以浅色页都是浅色。这里直接钉 theme.id，
            # 检查玻璃层、空封面占位、TabBar 选中色在暗底上还站不站得住。
            shoot "$UDID" "shots/${SLUG}-10-home-dark.png" '{"theme.id":"black"}' 12
            shoot "$UDID" "shots/${SLUG}-11-play-detail-dark.png" '{"theme.id":"black","player.startupPushPlayDetailScreen":true}' 14
            # 深色不能只验首页和播放页：列表页有玻璃卡片与分隔线、设置页有整排
            # 复选行，都是浅色下定的对比度，换暗底后最容易糊成一片。
            shoot "$UDID" "shots/${SLUG}-12-songlist-dark.png" '{"theme.id":"black","common.startupNavId":"nav_songlist"}' 10
            shoot "$UDID" "shots/${SLUG}-13-chart-dark.png" '{"theme.id":"black","common.startupNavId":"nav_top"}' 12
            shoot "$UDID" "shots/${SLUG}-14-setting-dark.png" '{"theme.id":"black","common.startupNavId":"nav_setting"}' 10

            # 有歌态：前面 14 张全是空列表，迷你条永远是「未在播放」，等于
            # 真实用起来最常看的那一屏从没被检查过。这两页塞一首演示曲进去。
            shoot "$UDID" "shots/${SLUG}-15-player-song.png" '{"player.startupAutoPlay":false}' 12 demo
            shoot "$UDID" "shots/${SLUG}-16-play-detail-song.png" '{"player.startupAutoPlay":false,"player.startupPushPlayDetailScreen":true}' 14 demo

            # 进程还活着才算启动成功
            if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$IOS_BUNDLE_IDENTIFIER"; then
              echo "::warning::$NAME 上没看到应用进程，附设备日志"
              with_timeout 90 xcrun simctl spawn "$UDID" log show --last 2m --style compact \
                --predicate 'process == "LxMusicMobile"' > "shots/${SLUG}-device.log"
            fi
            xcrun simctl status_bar "$UDID" clear >/dev/null 2>&1 || true
            echo "[$(stamp)] == done $NAME"
          done

          ls -la shots

      - name: Shrink screenshots
        if: always()
        # 3x 的 iPhone 16 Pro 截图单张 1.8~3.4MB，16 张打完包 20MB，
        # 在这条线路上按 15KB/s 拉就是 25 分钟。上一次只做了 sips -Z 1748，
        # 仍是 19MB——截图的噪点纹理让 PNG 几乎压不动。转成 q90 的 JPEG
        # 后单张约 350KB，整包 5MB 出头，下载时间降到几分钟；文字边缘、
        # 圆角、字重仍然看得清，够做版式判断。
        run: |
          shopt -s nullglob
          for f in shots/*.png; do
            j="${f%.png}.jpg"
            if sips -s format jpeg -s formatOptions 90 -Z 1748 "$f" --out "$j" >/dev/null 2>&1; then
              rm -f "$f"
            fi
          done
          du -ch shots/*.jpg 2>/dev/null | tail -1 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots
          if-no-files-found: warn

      - name: Publish shots to the shots branch
        if: always()
        # artifact 通道（api.github.com）在这条线路上只有 2~15KB/s，19MB
        # 要挂半小时以上；同一仓库的 git 传输却是秒级。这里把图 push 到
        # 一条独立的 shots 分支（每次 force 覆盖），本地 `git fetch
        # --depth 1 origin shots` 就能取到，artifact 只留作兜底。
        env:
          TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(shots/*.jpg)
          publish="$(mktemp -d)"
          if [ ${#files[@]} -gt 0 ]; then
            cp "${files[@]}" "$publish/"
          fi
          # 构建失败时截图目录是空的，artifact 里的日志也只有几百字节
          # （api.github.com 这条线路拉不动）。日志尾部跟着分支一起走，
          # 失败原因才拿得到。
          if [ -s build/xcodebuild-sim.log ]; then
            tail -n 200 build/xcodebuild-sim.log > "$publish/xcodebuild-tail.txt"
          fi
          entries=$(ls -A "$publish")
          if [ -z "$entries" ]; then
            echo "nothing to publish"
            exit 0
          fi
          cd "$publish"
          git init -q .
          git checkout -q -b shots
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "shots: run ${GITHUB_RUN_NUMBER} ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots
          echo "published $(ls -1 | wc -l) files to the shots branch"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-build-log
          path: build/xcodebuild-sim.log
          if-no-files-found: ignore