name: iOS Screenshots

# 在 macOS runner 上启动 iOS 模拟器、安装 Release 包、启动并截图。
# 产物 ios-screenshots 里每台机型一组：首页、稳定态、播放详情。
# 目的：没有本地 Mac 时，也能拿到真实渲染画面核对版式。
on:
  workflow_dispatch:
    inputs:
      devices:
        description: '机型，逗号分隔；留空则用 iPhone 16 Pro'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-screenshots
  cancel-in-progress: true

jobs:
  screenshot:
    name: Screenshot on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NO_FLIPPER: 1
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_SCHEME: LxMusicMobile
      IOS_BUNDLE_IDENTIFIER: cn.toside.music.mobile
      DERIVED_DATA_PATH: build/DerivedData

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          cd ios
          bundle exec pod install --repo-update

      # Release 会把 JS 打进 app，模拟器里不需要再起 Metro。
      - name: Build for simulator
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee build/xcodebuild-sim.log

      # 模拟器命令偶尔会卡住（bootstatus / spawn / log show），全部套超时，
      # 卡住只降级、不拖垮整条流水线。
      - name: Boot simulators and capture
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p shots

          stamp() { date -u '+%H:%M:%S'; }
          with_timeout() {
            local secs="$1"; shift
            echo "[$(stamp)] == $* (max ${secs}s)"
            perl -e 'alarm shift; exec @ARGV' "$secs" "$@" || echo "::warning::timed out or failed: $*"
          }

          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::没有找到 .app"
            find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 3 -name '*.app'
            exit 1
          fi
          echo "app: $APP_PATH"

          DEVICES="${{ inputs.devices }}"
          if [ -z "$DEVICES" ]; then
            DEVICES="iPhone 16 Pro"
          fi

          with_timeout 120 xcrun simctl list devices available

          udid_of() {
            xcrun simctl list devices available -j \
              | jq -r --arg n "$1" '[.devices[][] | select(.isAvailable and .name == $n)][0].udid // empty'
          }
          name_of() {
            xcrun simctl list devices available -j \
              | jq -r --arg u "$1" '[.devices[][] | select(.udid == $u)][0].name // empty'
          }
          first_iphone() {
            xcrun simctl list devices available -j \
              | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty'
          }

          # 首启有两个闸门：谨防被骗提示、许可协议。两者都在 AsyncStorage 的
          # manifest.json 里有开关，直接写进去，截图才拍得到真正的界面。
          write_manifest() {
            local udid="$1" setting="$2" container manifest
            container="$(xcrun simctl get_app_container "$udid" "$IOS_BUNDLE_IDENTIFIER" data 2>/dev/null)"
            if [ -z "$container" ]; then
              echo "::warning::拿不到 app 容器，跳过早读标记"
              return 0
            fi
            manifest="$container/Library/Application Support/$IOS_BUNDLE_IDENTIFIER/RCTAsyncLocalStorage_V1/manifest.json"
            if [ ! -f "$manifest" ]; then
              echo "::warning::manifest 不在默认路径，回退搜索"
              manifest="$(find "$container" -name manifest.json -path '*RCTAsyncLocalStorage*' -print -quit)"
            fi
            if [ -z "$manifest" ] || [ ! -f "$manifest" ]; then
              echo "::warning::没找到 AsyncStorage manifest，首启提示可能弹窗"
              return 0
            fi
            echo "seed settings -> $manifest"
            jq --arg v "$setting" '. + {"@cheat_tip":"true","@setting_v1":$v}' "$manifest" > "$manifest.tmp" \
              && mv "$manifest.tmp" "$manifest"
          }

          # 首页用配置：不进详情页
          SETTING_HOME='{"version":"2.0","common.isAgreePact":true,"common.langId":"zh-cn","player.startupPushPlayDetailScreen":false}'
          # 详情页用配置：Home 挂载后直接推播放详情页，无需点按和 deep link
          SETTING_DETAIL='{"version":"2.0","common.isAgreePact":true,"common.langId":"zh-cn","player.startupPushPlayDetailScreen":true}'

          TARGETS=""
          IFS=',' read -ra WANTED <<< "$DEVICES"
          for RAW in "${WANTED[@]}"; do
            NAME="$(echo "$RAW" | sed 's/^ *//; s/ *$//')"
            [ -z "$NAME" ] && continue
            UDID="$(udid_of "$NAME")"
            if [ -z "$UDID" ]; then
              echo "::warning::模拟器不可用，跳过：$NAME"
              continue
            fi
            TARGETS="$TARGETS $UDID"
          done

          if [ -z "$TARGETS" ]; then
            FALLBACK="$(first_iphone)"
            if [ -z "$FALLBACK" ]; then
              echo "::error::这台 runner 上没有可用的 iPhone 模拟器"
              exit 1
            fi
            echo "::warning::请求的机型都不存在，改用 $(name_of "$FALLBACK")"
            TARGETS=" $FALLBACK"
          fi

          for UDID in $TARGETS; do
            NAME="$(name_of "$UDID")"
            [ -z "$NAME" ] && NAME="device-${UDID%%-*}"
            SLUG="$(echo "$NAME" | tr ' ()/' '----' | tr -s '-' | tr 'A-Z' 'a-z')"
            echo "[$(stamp)] == $NAME ($UDID) -> shots/$SLUG"

            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            with_timeout 180 xcrun simctl boot "$UDID"
            with_timeout 240 xcrun simctl bootstatus "$UDID" -b || true
            with_timeout 60 xcrun simctl ui "$UDID" appearance dark
            with_timeout 60 xcrun simctl status_bar "$UDID" override \
              --time "9:41" --batteryState charged --batteryLevel 100 \
              --wifiBars 3 --cellularBars 4
            with_timeout 120 xcrun simctl install "$UDID" "$APP_PATH"

            # 先启动一次建出存储目录，写首启标记，再重启拍照
            with_timeout 60 xcrun simctl launch "$UDID" "$IOS_BUNDLE_IDENTIFIER"
            sleep 8
            with_timeout 60 xcrun simctl terminate "$UDID" "$IOS_BUNDLE_IDENTIFIER"
            write_manifest "$UDID" "$SETTING_HOME"

            with_timeout 60 xcrun simctl launch "$UDID" "$IOS_BUNDLE_IDENTIFIER"
            sleep 12
            with_timeout 60 xcrun simctl io "$UDID" screenshot "shots/${SLUG}-01-home.png"
            sleep 5
            with_timeout 60 xcrun simctl io "$UDID" screenshot "shots/${SLUG}-02-home-settled.png"

            # 换成"启动即进播放详情"的配置，冷启动再拍一组
            with_timeout 60 xcrun simctl terminate "$UDID" "$IOS_BUNDLE_IDENTIFIER"
            write_manifest "$UDID" "$SETTING_DETAIL"
            with_timeout 60 xcrun simctl launch "$UDID" "$IOS_BUNDLE_IDENTIFIER"
            sleep 14
            with_timeout 60 xcrun simctl io "$UDID" screenshot "shots/${SLUG}-03-play-detail.png"

            # 进程还活着才算启动成功
            if ! xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$IOS_BUNDLE_IDENTIFIER"; then
              echo "::warning::$NAME 上没看到应用进程，附设备日志"
              with_timeout 90 xcrun simctl spawn "$UDID" log show --last 2m --style compact \
                --predicate 'process == "LxMusicMobile"' > "shots/${SLUG}-device.log"
            fi
            xcrun simctl status_bar "$UDID" clear >/dev/null 2>&1 || true
            echo "[$(stamp)] == done $NAME"
          done

          ls -la shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-build-log
          path: build/xcodebuild-sim.log
          if-no-files-found: ignore