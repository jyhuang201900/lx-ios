<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>镜像 · 歌单（三列卡片 meta 两行）</title>
<link rel="stylesheet" href="base.css">
<style>
  .bar {
    display: flex;
    align-items: center;
    gap: var(--gap-tight);
    padding: 0 var(--gutter);
    height: var(--toolbar-h);
  }
  .bar .chip {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 64px;
    height: var(--control-h);
    padding: 0 12px;
    border-radius: var(--radius-button);
    font-size: var(--fs-section);
    color: var(--font-label);
    flex: 0 0 auto;
  }
  .bar .chip.on { color: var(--primary-font); background: var(--primary-light-800); }
  .bar .solid {
    display: flex;
    align-items: center;
    gap: 6px;
    height: var(--control-h);
    padding: 0 14px;
    border-radius: var(--radius-button);
    background: var(--primary-font);
    color: #fff;
    font-size: var(--fs-section);
    margin-left: auto;
    flex: 0 0 auto;
  }

  .grid {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 12px 10px;
    padding: 4px var(--gutter) 0;
    overflow: hidden;
  }
  /* 卡片宽 = (402 - 15) / 3 ≈ 129，和 RN 一致 */
  .card { width: 110px; }
  .card .art {
    width: 110px;
    height: 129px;
    border-radius: var(--radius-card);
    background: linear-gradient(150deg, #dfeee6, #cfe4d8 60%, #e9f3ec);
    box-shadow: 0 4px 12px -6px rgba(0, 0, 0, 0.25);
  }
  .card .art.alt { background: linear-gradient(150deg, #e4e9ef, #d4dde6 60%, #eef2f6); }
  .card .art.alt2 { background: linear-gradient(150deg, #efe6da, #e4d7c6 60%, #f5eee5); }
  .card .name {
    margin-top: 8px;
    font-size: var(--fs-compact);
    line-height: 17px;
    color: var(--font);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  /* meta 拆两层：作者一行、播放量·曲目数一行，都是 numberOfLines=1 */
  .card .author {
    margin-top: 4px;
    font-size: var(--fs-caption);
    line-height: 14px;
    color: var(--font-label);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .meta {
    font-size: var(--fs-caption);
    line-height: 15px;
    color: var(--font-label);
    opacity: 0.8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>
<div class="phone" id="screen">
  <div class="aurora"><i class="a"></i><i class="b"></i></div>
  <div class="grain"></div>
  <div class="statusbar"></div>

  <div class="bar">
    <div class="chip glass">小蜗音乐</div>
    <div class="chip glass on">最新</div>
    <div class="chip glass">默认 ›</div>
    <div class="solid">打开</div>
  </div>

  <div class="grid">
    <div class="card"><div class="art"></div><div class="name">华语流行精选集</div><div class="author">音乐研究所</div><div class="meta">1万 · 55 首</div></div>
    <div class="card"><div class="art alt"></div><div class="name">深夜电台</div><div class="author">夜行者</div><div class="meta">8623 · 40 首</div></div>
    <div class="card"><div class="art alt2"></div><div class="name">港乐回响</div><div class="author">粤语老友</div><div class="meta">2.4万 · 120 首</div></div>

    <div class="card"><div class="art alt2"></div><div class="name">清晨第一首歌</div><div class="author">早八人</div><div class="meta">531 · 18 首</div></div>
    <div class="card"><div class="art"></div><div class="name">爵士小酒馆</div><div class="author">蓝调周</div><div class="meta">1.1万 · 66 首</div></div>
    <div class="card"><div class="art alt"></div><div class="name">民谣旅行</div><div class="author">山野</div><div class="meta">9876 · 48 首</div></div>

    <div class="card"><div class="art alt"></div><div class="name">纯音乐 · 专注</div><div class="author">白噪音站</div><div class="meta">3.2万 · 200 首</div></div>
    <div class="card"><div class="art alt2"></div><div class="name">摇滚现场</div><div class="author">鼓手阿飞</div><div class="meta">4502 · 30 首</div></div>
    <div class="card"><div class="art"></div><div class="name">雨天循环</div><div class="author">湿漉漉</div><div class="meta">7781 · 42 首</div></div>
  </div>

  <div class="player-bar">
    <div class="cover">♪</div>
    <div class="meta"><div class="t">未在播放</div><div class="s">从榜单或歌单挑一首开始</div></div>
    <div class="play"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
    <div class="next"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l9 6-9 6z"/><rect x="16" y="6" width="2.4" height="12" rx="1"/></svg></div>
  </div>

  <div class="tabbar">
    <div class="tab"><span class="g">⌕</span><span>搜索</span></div>
    <div class="tab on"><span class="g">♪</span><span>歌单</span></div>
    <div class="tab"><span class="g">≋</span><span>排行榜</span></div>
    <div class="tab"><span class="g">♡</span><span>我的列表</span></div>
    <div class="tab"><span class="g">⬒</span><span>本地歌曲</span></div>
    <div class="tab"><span class="g">◎</span><span>设置</span></div>
  </div>
</div>
</body>
</html>
