<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>镜像 · 首页（搜索页空态）</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 首页专属：工具栏 → 空态 → 迷你条 → TabBar 的纵向分配 */
  .phone { }
</style>
</head>
<body>
<div class="phone" id="screen">
  <div class="aurora"><i class="a"></i><i class="b"></i></div>
  <div class="grain"></div>

  <div class="statusbar"></div>

  <div class="toolbar">
    <div class="source-chip glass">聚合大会</div>
    <div class="search-box glass">
      <span class="ico"></span>
      <span>搜我所想...</span>
    </div>
    <div class="type-toggle glass">
      <span class="opt on">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </span>
      <span class="opt">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 4v17"/><path d="M15 9v5"/><circle cx="15" cy="16.4" r="1.1" fill="currentColor" stroke="none"/></svg>
      </span>
    </div>
  </div>

  <div class="content">
    <div class="empty-state">
      <div class="badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      </div>
      <div class="title">搜我所想~~😏</div>
      <div class="desc">输入歌名、歌手或专辑名，结果会按音源聚合</div>
    </div>
  </div>

  <div class="player-bar">
    <div class="cover">♪</div>
    <div class="meta">
      <div class="t">未在播放</div>
      <div class="s">从榜单或歌单挑一首开始</div>
    </div>
    <div class="play">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l9 6-9 6z"/><rect x="16" y="6" width="2.4" height="12" rx="1"/></svg>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><span class="g">⌕</span><span>搜索</span></div>
    <div class="tab"><span class="g">♪</span><span>歌单</span></div>
    <div class="tab"><span class="g">≋</span><span>排行榜</span></div>
    <div class="tab"><span class="g">♡</span><span>我的列表</span></div>
    <div class="tab"><span class="g">⬒</span><span>本地歌曲</span></div>
    <div class="tab"><span class="g">◎</span><span>设置</span></div>
  </div>
</div>
</body>
</html>
